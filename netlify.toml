[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Server code, notes and local data are never served as pages
[[redirects]]
  from = "/server/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/data/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/ORDERING.md"
  to = "/404"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-store"
